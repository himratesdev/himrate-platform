# Тексты разбора вердикта (Trust::Explanation → карточка канала, блок «Из чего сложилась оценка»).
#
# Живут здесь по той же причине, что и band.*.yml и reason.*.yml: карточка не носит с собой
# словарь, сервер отдаёт копию уже разрешённой в локали запроса (кэш ключуется локалью).
#
# ПРАВИЛА ФОРМУЛИРОВОК те же: слов «боты», «накрутка», «фейк» здесь нет. Текст объясняет, почему
# вычтенное не выставлено доказательством, и понятен человеку, впервые открывшему сайт.
ru:
  explanation:
    # Именованные аккаунты вычтены из ERV, но чат слишком мал, чтобы доля от него что-то значила
    # (chard_frac_roster_min, DETECTION-AUDIT 2026-09-19). Формулировка обходит согласование
    # числительного: «%{n} человек» ломается на 1 и 2 — поэтому «чат из %{n} человек».
    named_set_aside: "чат из %{n} человек — доля не считается доказательством"
