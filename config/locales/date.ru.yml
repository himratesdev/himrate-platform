# TASK-H8 CR iter-1: явные форматы дат для I18n.l. Гема rails-i18n в проекте нет, поэтому
# без этого файла :ru падал в :en-фолбэк ActiveSupport и русский пользователь видел
# «активирован до 2026-12-01» вместо «01.12.2026» (регресс относительно клиентского
# toLocaleDateString, который отдавал форматирование браузеру).
ru:
  date:
    formats:
      default: "%d.%m.%Y"
      short: "%d.%m"
      long: "%d %B %Y"
    abbr_day_names: [Вс, Пн, Вт, Ср, Чт, Пт, Сб]
    day_names: [воскресенье, понедельник, вторник, среда, четверг, пятница, суббота]
    abbr_month_names: [~, янв, фев, мар, апр, мая, июн, июл, авг, сен, окт, ноя, дек]
    month_names: [~, января, февраля, марта, апреля, мая, июня, июля, августа, сентября, октября, ноября, декабря]
