# Тексты причин, из которых складывается вердикт (TI v2, ReasonCodeBuilder).
#
# До 2026-09-09 их не существовало нигде на сервере: карточка держала неполную карту в JS
# (девять из четырнадцати, одна к уже мёртвому коду), и шесть кодов молча выпадали из разбора.
# Разбор вердикта — то, за что платят, поэтому тексты живут здесь, рядом со шкалой (band.*.yml),
# и отдаются API уже разрешёнными.
#
# ПРАВИЛА ФОРМУЛИРОВОК: слов «боты», «накрутка», «фейк» здесь нет и быть не должно — это
# нейтральная шкала. Обвинительная формулировка допускается только на плашке координации при
# жёсткой корроборации (решение PO 2026-09-09), и она живёт не тут.
# Каждый текст объясняет НАБЛЮДЕНИЕ, а не приговор, и понятен человеку, впервые открывшему сайт.
ru:
  reason:
    hard_named_fraction:
      title: "Часть чата ведёт себя как автоматика"
      # Формулировка обходит согласование числительного: «%{n} аккаунтов» ломается на 1, 2 и 124.
      text: "Мы разобрали писавших поимённо. Аккаунтов, которые пишут с ровными, машинными интервалами и одновременно участвуют в нескольких каналах: %{n} — это %{pct}%% чата. Их вклад в онлайн вычтен."
      tone: warn
    self_history_inflation_event:
      title: "Онлайн скакнул против собственной истории"
      text: "Число зрителей выросло скачком, а активность в чате осталась прежней. Раньше этот канал так себя не вёл."
      tone: warn
    self_history_sustained_inflation:
      title: "Разрыв держится не первый эфир"
      text: "Уже несколько эфиров подряд онлайн выше того, что подтверждается активностью чата."
      tone: warn
    inflation_event_corroboration:
      title: "Скачок подтверждён вторым признаком"
      text: "Рост онлайна совпал с независимым признаком и не объясняется рейдом или встроенным плеером."
      tone: warn
    population_chat_deficit:
      title: "Пишущих меньше, чем у похожих каналов"
      text: "Для этой категории, размера аудитории и языка обычно пишет заметно большая доля зрителей."
      tone: warn
    self_history_stable_clean:
      title: "История канала ровная"
      text: "Соотношение зрителей и активности чата держится на одном уровне от эфира к эфиру."
      tone: ok
    chatter_quality_high:
      title: "Чат живой"
      text: "Пишут зрители с историей на платформе, а не свежесозданные пустые аккаунты."
      tone: ok
    provisional_basic:
      title: "Оценка предварительная"
      text: "Пока собрано эфиров: %{n}. Полная оценка появится после десятого."
      tone: dim
    engagement_deficit_uncorroborated:
      title: "Активность ниже ожидаемой, но подтверждений нет"
      text: "Пишущих меньше нормы, при этом ни один независимый признак этого не подтверждает. Так выглядит канал с молчаливой аудиторией."
      tone: dim
    chatter_quality_low:
      title: "Об аккаунтах чата почти ничего не известно"
      text: "У писавших пустые или совсем новые профили. Это не обвинение — это снижает уверенность в оценке."
      tone: dim
    cold_start_insufficient:
      title: "Данных для оценки пока нет"
      text: "Собрано эфиров: %{n}. Вердикт появляется начиная с третьего."
      tone: dim
    raid_host_embed_window:
      title: "Был приток с другой площадки"
      text: "В окне расчёта пришёл рейд или трансляцию смотрели через встроенный плеер на стороннем сайте. Такой скачок мы каналу не приписываем."
      tone: dim
    unattributed_surge:
      title: "Приток без источника"
      text: "Онлайн вырос, но откуда пришли зрители — определить не удалось."
      tone: warn
    wide_interval_thin_sample:
      title: "Диапазон шире обычного"
      text: "В этом эфире мало наблюдений, поэтому границы оценки разошлись сильнее обычного."
      tone: dim
