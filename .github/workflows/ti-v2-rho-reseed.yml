name: ti-v2-rho-reseed
# [skip ci] ops. TI v2.1 GATE-0 ρ* RE-SEED with a dryrun honest-impact gate + apply auto-rollback — the
# safety gate0-seed.yml lacks. Seeds the windowed per-cell ρ* (rho_star=P50, rho_lo=P10, rho_hi=P90,
# calibrated=true) from the POOLED windowed shadow corpus (accrued cross-run by the hourly
# ti-v2-shadow-mine; the pool lives in verivio-clode _tasks/T1-074/rho-raw/ because docker json-logs
# rotate ~30min). The re-seed unblocks: honest false-AMBER cleanup + trustworthy F_soft (cell_calibrated
# for more cells) + the C_pop flip prerequisite. STAGING-ONLY, reversible (data-only).
#   mode=dryrun : upsert the cells in a ROLLED-BACK txn → scan the live honest RU cohort band mix
#                 BEFORE vs AFTER → confirm honest AMBER DROPS (false-AMBER cleanup) AND 0 new honest
#                 RED/YELLOW. Read-only (rolls back). ALWAYS run this first.
#   mode=apply  : snapshot prior cell values → upsert calibrated → honest verify → AUTO-ROLLBACK (restore
#                 the snapshot) if any honest RED/YELLOW appears. Only after dryrun is SAFE.
# ⚠ MATURITY: only reseed once the pooled corpus has ≥ ~12 cells at n≥8 (windowed). Assess laptop-side
# from the shadow-mine pool. cells_json = the mined per-cell rows (see the recipe in the memory /
# _tasks/T1-074). PO pre-authorized 2026-07-27 «когда созреет начинай» — dryrun→apply autonomous.
on:
  workflow_dispatch:
    inputs:
      target: { required: true, type: choice, options: [home], default: home }
      mode: { required: true, type: choice, options: [dryrun, apply], default: dryrun }
      honest_sample: { required: false, type: string, default: "80" }
      # JSON array of per-cell rows: [{"cat":"gaming","vb":"1k-5k","cm":"open","lang":"RU","star":0.09,"lo":0.05,"hi":0.15,"n":11}, ...]
      cells_json: { required: true, type: string, default: "[]" }

jobs:
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Tailnet SSH (home server)
        uses: ./.github/actions/tailnet-ssh
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run on ${{ inputs.target }}
        run: |
          TARGET="${{ inputs.target || 'home' }}"
          CONTAINER=$(ssh ${TARGET} "docker ps --filter 'name=himrate-web-staging' --format '{{.Names}}' | head -1")
          echo "container: ${CONTAINER}"
          CELLS_JSON=$(cat <<'CJSON'
          ${{ inputs.cells_json }}
          CJSON
          )
          ssh ${TARGET} "docker exec \
            -e RESEED_MODE='${{ inputs.mode }}' -e HONEST_SAMPLE='${{ inputs.honest_sample || '80' }}' \
            -e CELLS_JSON=$(printf %q "$CELLS_JSON") \
            ${CONTAINER} sh -c 'bin/rails ti_v2:rho_reseed 2>&1; echo RAILS_EXIT=\$?'" 2>&1 | tr -cd '\11\12\15\40-\176' | grep -avE '36;1m|Flipper audit|connecting to Redis|stackprof|Please add|KnownBotService' || true
