name: ti-v2-shadow-mine
# T1-074 GATE-0 — mine the SCW shadow log into the dense per-cell ρ* seed table. READ-ONLY, $0.
# Prereq: Flipper ti_v2_shadow ON (PO one-click) + PR #384 deployed (shadow line carries
# v2_v/v2_rho_obs/v2_eihc/v2_rho_star). With shadow ON, EVERY SCW cycle (~30s/stream) logs a
# calibration sample per live channel → after a few hours this is far denser than manual
# ti-v2-rho-build runs (intra-stream medians smooth roster-growth/CCV wobble).
# Pipeline: grep "SCW shadow" from all himrate staging containers (last N hours) → per-stream
# median ρ_obs → honest-anchor filter (partner ∧ ≥10 completed ∧ TI≥88 ∧ current-stream
# viewbot/ccv-step anomaly non-raid excluded ∧ roster spam-temporal ≤5%) → per-cell
# ρ_lo(P10)/ρ*(P50)/ρ_hi(P90) + RAW rows (pooling with ti-v2-rho-build format).
on:
  schedule:
    - cron: "20 * * * *" # hourly harvest — docker json-log rotation caps the window at ~25-30min, so hourly ≈ lossless pooling cadence (cross-run RAW pool in verivio-clode _tasks/T1-074/rho-raw/)
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [home]
        default: home
      hours:
        required: false
        type: string
        default: "6"
      convention:
        description: "ρ_obs convention to pool (P0.5). 'cumulative' pre-FLIP (today); 'windowed' for the re-seed after ti_v2_cowindowed_rho is ON — never mix the two."
        required: false
        type: choice
        options: [cumulative, windowed]
        default: cumulative

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # mining BOTH conventions on the schedule doubles the honest-anchor filter pass
    steps:
      - uses: actions/checkout@v7
      - name: Tailnet SSH (home server)
        uses: ./.github/actions/tailnet-ssh
        with:
          ts_authkey: ${{ secrets.TS_AUTHKEY }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Collect shadow lines from containers
        run: |
          TARGET="${{ inputs.target || 'home' }}" # inputs empty on schedule events
          HOURS="${{ inputs.hours || '1' }}"
          ssh ${TARGET} "rm -f /tmp/shadow_lines.txt; for c in \$(docker ps --filter 'name=himrate' --format '{{.Names}}'); do docker logs --since ${HOURS}h \$c 2>&1 | grep -F 'SCW shadow ' >> /tmp/shadow_lines.txt || true; done; wc -l /tmp/shadow_lines.txt"


      - name: Run miner on ${{ inputs.target || 'home' }}
        run: |
          TARGET="${{ inputs.target || 'home' }}"
          # On the hourly SCHEDULE (inputs empty) mine BOTH conventions so the windowed ρ_obs corpus is
          # captured before docker json-logs rotate (~30min) — the P2 re-seed needs windowed samples and
          # they can't be recovered once rotated. On manual dispatch, mine just the requested convention.
          CONV_IN="${{ inputs.convention }}"
          if [ -z "$CONV_IN" ]; then CONVS="cumulative windowed"; else CONVS="$CONV_IN"; fi
          CONTAINER=$(ssh ${TARGET} "docker ps --filter 'name=himrate-web-staging' --format '{{.Names}}' | head -1")
          echo "container: ${CONTAINER} | conventions: ${CONVS}"
          ssh ${TARGET} "docker cp /tmp/shadow_lines.txt ${CONTAINER}:/tmp/shadow_lines.txt"
          for c in $CONVS; do
            echo "===================== MINING convention=$c ====================="
            ssh ${TARGET} "docker exec -e MINE_CONV=\"$c\" ${CONTAINER} sh -c 'bin/rails ti_v2:shadow_mine 2>&1; echo RAILS_EXIT=\$?'" 2>&1 | grep -vE 'Flipper audit|connecting to Redis|stackprof|Please add|KnownBotService: init' || true
          done
