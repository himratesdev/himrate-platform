name: ti-v2-deficit-floor-flip
# [skip ci] FULL-CHAIN Flip-1 — deficit_min_ccv (M4 shared deficit-family floor). This is the FP-REDUCTION
# flip: below the floor, deficit-family accusations (F_soft label / F_self / C_self^SP [P2] / C_pop) are
# suppressed as integer-quantization noise — it kills the live C_self^SP micro-channel over-accusation
# (tremortela ccv=2, dbmezzy) without touching any materially-online channel. It can ONLY remove
# accusations. Staging-only, reversible (deficit_min_ccv → 0.0).
#   mode=dryrun : compute the live fleet with floor=0 (current) vs floor=CCV (K.with injection, NO DB write)
#                 → report EVERY band change. SAFETY GATE: every changed channel MUST have V < CCV and the
#                 direction MUST be de-accusation (yellow/red/amber → green/grey). A change on a V ≥ CCV
#                 channel, or ANY channel gaining an accusation, is a BUG → do NOT apply.
#   mode=apply  : write deficit_min_ccv=CCV (staging CalibrationConstant) → re-verify → AUTO-ROLLBACK to 0.0
#                 if any V ≥ CCV channel changed band (the floor must be strictly below-materiality only).
on:
  workflow_dispatch:
    inputs:
      target: { required: true, type: choice, options: [hostkey], default: hostkey }
      mode: { required: true, type: choice, options: [dryrun, apply], default: dryrun }
      ccv: { required: false, type: string, default: "50" }
      sample: { required: false, type: string, default: "250" }

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH
        run: |
          mkdir -p ~/.ssh; echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf 'Host hostkey\n  HostName 82.21.7.48\n  User root\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/id_ed25519\n  ConnectTimeout 30\n' >> ~/.ssh/config; chmod 600 ~/.ssh/config

      - name: Build
        run: |
          cat > /tmp/dff.rb <<'RB'
          $stdout.sync = true
          MODE = ENV.fetch("MODE", "dryrun")
          CCV  = ENV.fetch("CCV", "50").to_f
          N    = ENV.fetch("SAMPLE", "250").to_i.clamp(50, 600)
          CB = TrustIndex::ContextBuilder

          # Compute a stream's band under a given k. Returns [band_str, accusatory_bool, V_inst, v_eff] or
          # nil. v_eff = min(V_W, V_inst) is the DEFICIT frame the floor actually acts on (the engine floors
          # deficit-family arms on v_eff/self_v, NOT instant V) — the safety gate must compare v_eff, not the
          # display V (a channel with instant V just over the floor but a windowed dip below it is correctly
          # floored on its deficit frame).
          def verdict(s, k)
            ctx = CB.build(s); v2c = CB.build_v2(s, ctx)
            return nil if v2c.v.nil? || v2c.v <= 0
            wr, vw = CB.windowed_inputs(s)
            r = TrustIndex::V2::Engine.compute(context: (vw ? v2c.with(l2_roster_usernames: wr, v_w: vw) : v2c), k: k)
            v_eff = vw ? [ vw, v2c.v ].min : v2c.v
            [ "#{r.band&.color}/#{r.band&.row}#{r.band&.sub}", %w[red yellow].include?(r.band&.color), v2c.v, v_eff ]
          rescue StandardError
            nil
          end

          k0 = Calibration::Registry.load                       # current (floor from DB; dormant 0.0)
          k1 = k0.with(deficit_min_ccv: CCV)                    # simulated floor=CCV (no DB write)
          puts "===== deficit_min_ccv Flip-1 MODE=#{MODE} CCV=#{CCV} @ #{Time.current.iso8601} ====="
          puts "current deficit_min_ccv (DB) = #{CalibrationConstant.value_for('deficit_min_ccv', fallback: 'MISSING(0.0)')}"

          live = Stream.where(ended_at: nil).where(language: "RU").order(started_at: :desc).limit(1000).to_a
          changed = []; n = 0; above_floor_changed = []; gained = []
          before = Hash.new(0); after = Hash.new(0)
          live.each do |s|
            break if n >= N
            b0 = verdict(s, k0); next if b0.nil?
            b1 = verdict(s, k1); next if b1.nil?
            n += 1
            before[b0[0]] += 1; after[b1[0]] += 1
            next if b0[0] == b1[0]
            row = "#{s.channel.login.ljust(20)} V=#{b0[2].to_i.to_s.ljust(5)} v_eff=#{b0[3].to_i.to_s.ljust(5)} #{b0[0]} → #{b1[0]}"
            changed << row
            above_floor_changed << row if b0[3].to_f >= CCV     # 🔴 a change with deficit-frame v_eff ≥ floor = BUG
            gained << row if !b0[1] && b1[1]                    # 🔴 gained an accusation = BUG (floor only removes)
          end

          puts "\n== BAND MIX == before: #{before.sort.to_h}"
          puts "               after:  #{after.sort.to_h}"
          puts "\n== CHANGED #{changed.size}/#{n} (all MUST be V<#{CCV} AND de-accusation) =="
          changed.first(30).each { |x| puts "  #{x}" }
          puts "\n== 🔴 SAFETY VIOLATIONS =="
          puts "  changes at/above floor (V≥#{CCV}, MUST be 0): #{above_floor_changed.size}"
          above_floor_changed.first(10).each { |x| puts "     #{x}" }
          puts "  channels that GAINED an accusation (MUST be 0): #{gained.size}"
          gained.first(10).each { |x| puts "     #{x}" }
          safe = above_floor_changed.empty? && gained.empty?

          if MODE == "dryrun"
            puts(safe ? "\n🟢 DRYRUN SAFE — only sub-#{CCV.to_i} de-accusations. Apply is FP-reduction-only." : "\n🔴 DRYRUN UNSAFE — a materially-online channel changed or an accusation was gained. DO NOT apply.")
          elsif !safe
            puts "\n🔴 REFUSING TO APPLY — dryrun-equivalent check failed live. No write performed."
          else
            c = CalibrationConstant.find_or_initialize_by(key: "deficit_min_ccv")
            c.update!(value: CCV, calibrated: true, source: "fullchain_flip1_deficit_min_ccv_2026-07-27")
            # Re-verify LIVE (Registry.load now reads CCV). Confirm no V≥CCV channel is disturbed vs k0.
            post_above = 0
            live.first(N).each do |s|
              b0 = verdict(s, k0); bl = verdict(s, Calibration::Registry.load)
              next if b0.nil? || bl.nil?
              post_above += 1 if b0[3].to_f >= CCV && b0[0] != bl[0] # deficit-frame v_eff ≥ floor must be unperturbed
            end
            if post_above > 0
              CalibrationConstant.find_by(key: "deficit_min_ccv")&.update!(value: 0.0)
              puts "\n== 🔴 AUTO-ROLLBACK: #{post_above} materially-online channels disturbed → deficit_min_ccv=0.0. Investigate. =="
            else
              puts "\n== 🟢 APPLIED: deficit_min_ccv=#{CCV} LIVE (staging). FP-reduction only; V≥#{CCV} unperturbed. Reversible → 0.0. =="
            end
          end
          RB
          echo built

      - name: Run
        run: |
          scp /tmp/dff.rb hostkey:/tmp/dff.rb
          C=$(ssh hostkey "docker ps --filter 'name=himrate-web-staging' --format '{{.Names}}' | head -1")
          echo "container: $C"
          ssh hostkey "docker cp /tmp/dff.rb $C:/tmp/dff.rb && docker exec -e MODE='${{ inputs.mode }}' -e CCV='${{ inputs.ccv || '50' }}' -e SAMPLE='${{ inputs.sample || '250' }}' $C sh -c 'bin/rails runner /tmp/dff.rb 2>&1; echo RAILS_EXIT=\$?'" 2>&1 | tr -cd '\11\12\15\40-\176' | grep -avE '36;1m|Flipper audit|connecting to Redis|stackprof|Please add|KnownBot' || true
